limit_req_zone $binary_remote_addr zone=demo_api:10m rate=30r/m;

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    auth_basic "DocsGPT Interview Demo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        limit_req zone=demo_api burst=10 nodelay;
        proxy_pass http://backend:7091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        try_files /demo-entry.html =404;
        sub_filter_once on;
        sub_filter '__SHARED_AGENT_TOKEN__' '${SHARED_AGENT_TOKEN}';
    }

    location = /demo {
        try_files /demo-entry.html =404;
        sub_filter_once on;
        sub_filter '__SHARED_AGENT_TOKEN__' '${SHARED_AGENT_TOKEN}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /ops/ {
        try_files $uri $uri/ /ops/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/demo-shell.css"><script defer src="/demo-shell.js"></script></head>';
        sub_filter '</body>' '<a class="rag-ops-entry" href="/ops/" aria-label="打开评测与诊断台"><span>开发者</span>评测与诊断</a></body>';
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
