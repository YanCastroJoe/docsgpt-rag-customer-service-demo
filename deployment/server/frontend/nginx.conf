server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /agents/shared/${SHARED_AGENT_TOKEN};
    }

    location = /demo {
        return 302 /agents/shared/${SHARED_AGENT_TOKEN};
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /ops/ {
        try_files $uri $uri/ /ops/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/demo-shell.css"><script defer src="/demo-shell.js"></script></head>';
        sub_filter '</body>' '<a class="rag-ops-entry" href="/ops/" aria-label="打开评测与诊断台"><span>开发者</span>评测与诊断</a></body>';
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
